<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="./src/output.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="/assets/images/logo.png" type="image/x-icon">

    <title>Product Detail | LYSÉRIA</title>

</head>

<body class="bg-pearl text-navy">

    <!-- Navbar -->
    <nav class="fixed top-0 left-0 w-full bg-navy shadow-sm z-50">

        <div class="navbar max-w-7xl mx-auto px-6">

            <div class="navbar-start">

                <a href="index.html" class="font-display text-4xl tracking-[.15em] text-pearl">

                    LYSÉRIA

                </a>

            </div>

            <div class="navbar-end" style="display:flex;align-items:center;gap:16px;">

                <!-- Cart Icon with Badge -->
                <button id="ly-cart-btn" aria-label="Open shopping cart" style="position:relative;background:none;border:none;cursor:pointer;padding:4px;display:flex;align-items:center;color:#FAF7F2;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                    </svg>
                    <span class="ly-cart-badge" style="position:absolute;top:-7px;right:-7px;background:#C79A8B;color:#fff;border-radius:50%;width:18px;height:18px;font-size:0.58rem;font-weight:700;display:none;align-items:center;justify-content:center;font-family:'Inter',sans-serif;">0</span>
                </button>

                <a
                    href="catalog.html"
                    class="btn btn-outline btn-sm rounded-full border-pearl text-pearl hover:bg-pearl hover:text-navy">

                    ← Back to Catalog

                </a>

            </div>

        </div>

    </nav>

    <!-- Product Detail -->
    <section class="pt-36 pb-24 min-h-screen">

        <div
            id="product-detail"
            class="max-w-7xl mx-auto px-6">

            <!-- Detail akan diisi oleh detail.js -->

        </div>

    </section>

    <!-- Footer -->
    <footer class="bg-navy text-pearl">

        <div class="max-w-7xl mx-auto px-6 py-8 flex flex-col md:flex-row justify-between items-center gap-4">

            <h2 class="font-serif text-2xl">

                LYSÉRIA

            </h2>

            <p class="text-sm text-pearl/70">

                © 2026 LYSÉRIA. All Rights Reserved.

            </p>

        </div>

    </footer>

    <script src="./src/js/cart.js"></script>
    <script src="./src/js/detail.js"></script>

</body>

</html>
