<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — LYSÉRIA</title>
    <link href="/src/output.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="/assets/images/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="admin-login-body">

    <!-- Decorative blobs -->
    <div class="login-blob login-blob-1"></div>
    <div class="login-blob login-blob-2"></div>

    <div class="login-wrapper">

        <!-- Card -->
        <div class="login-card">

            <!-- Logo -->
            <div class="login-logo-wrap">
                <img src="../assets/images/logo.png" alt="Lyséria Logo" class="login-logo-img">
            </div>

            <p class="login-brand">LYSÉRIA</p>
            <p class="login-subtitle">Admin Portal</p>

            <!-- Divider -->
            <div class="login-divider"></div>

            <!-- Error Alert -->
            <div id="login-error" class="login-error hidden">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                    <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0zM7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 4.995z"/>
                </svg>
                <span id="login-error-text">Invalid credentials.</span>
            </div>

            <!-- Form -->
            <form id="login-form" class="login-form" autocomplete="off" novalidate>

                <div class="login-field">
                    <label class="login-label" for="login-username">Username</label>
                    <input
                        id="login-username"
                        type="text"
                        class="login-input"
                        placeholder="Enter username"
                        autocomplete="username"
                        required>
                </div>

                <div class="login-field">
                    <label class="login-label" for="login-password">Password</label>
                    <div class="login-pass-wrap">
                        <input
                            id="login-password"
                            type="password"
                            class="login-input"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required>
                        <button type="button" id="toggle-pass" class="login-eye-btn" aria-label="Toggle password visibility">
                            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="login-btn" class="login-btn">
                    <span id="login-btn-text">Sign In</span>
                    <span id="login-spinner" class="login-spinner hidden"></span>
                </button>

            </form>

            <p class="login-back">
                <a href="/">← Back to main site</a>
            </p>

        </div>

    </div>

    <script src="/admin/admin.js"></script>
    <script>
        // Redirect if already logged in
        if (sessionStorage.getItem('lyseria_admin')) {
            window.location.href = '/studio/dashboard';
        }

        const form = document.getElementById('login-form');
        const errorBox = document.getElementById('login-error');
        const errorText = document.getElementById('login-error-text');
        const btn = document.getElementById('login-btn');
        const btnText = document.getElementById('login-btn-text');
        const spinner = document.getElementById('login-spinner');
        const togglePass = document.getElementById('toggle-pass');
        const passInput = document.getElementById('login-password');

        // Toggle password visibility
        togglePass.addEventListener('click', () => {
            const isText = passInput.type === 'text';
            passInput.type = isText ? 'password' : 'text';
            togglePass.style.opacity = isText ? '0.5' : '1';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.add('hidden');

            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;

            // Show loading
            btnText.classList.add('hidden');
            spinner.classList.remove('hidden');
            btn.disabled = true;

            // Simulate short delay for UX
            await new Promise(r => setTimeout(r, 600));

            // Credentials check
            const ADMIN_USER = 'admin';
            const ADMIN_PASS = 'lyseria2026';

            if (username === ADMIN_USER && password === ADMIN_PASS) {
                sessionStorage.setItem('lyseria_admin', JSON.stringify({ user: username, loginAt: Date.now() }));
                window.location.href = '/studio/dashboard';
            } else {
                errorText.textContent = 'Incorrect username or password. Please try again.';
                errorBox.classList.remove('hidden');
                btnText.classList.remove('hidden');
                spinner.classList.add('hidden');
                btn.disabled = false;

                // Shake animation
                const card = document.querySelector('.login-card');
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 500);
            }
        });
    </script>

</body>
</html>
